/* Liquid glass surfaces and owner personalization */
:root{--glass-surface:rgba(255,255,255,.44);--glass-border:rgba(255,255,255,.76);--glass-shadow:0 12px 38px rgba(70,35,44,.07),inset 0 1px 0 rgba(255,255,255,.86);--on-primary:#ffffff}
body{background:radial-gradient(ellipse at 12% 12%,color-mix(in srgb,var(--green) 13%,transparent),transparent 48%),radial-gradient(ellipse at 94% 64%,color-mix(in srgb,var(--pink) 16%,transparent),transparent 43%),var(--bg);background-attachment:fixed}
.topbar,.guestheader,.appheader{background:var(--glass-surface);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-bottom:1px solid var(--glass-border)}
.sidebar{background:rgba(238,231,220,.53);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-right:1px solid var(--glass-border);box-shadow:inset -1px 0 0 #ffffff60}
.panel,.metric,.event,.step,.price,.tip,.guestwelcome,.photo,.wish,.book,.qrbox,.empty{background:var(--glass-surface);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);border-radius:19px}
.event,.photo{padding:8px}.eventcover{border-radius:12px}.eventbody{padding:18px 12px}.photo img{border-radius:12px}.photo .photofoot{padding:13px 9px 9px}.wish p{overflow-wrap:anywhere}.guestwelcome{border-radius:20px;padding:19px 22px}.banner,.sideplan{background:rgba(239,233,223,.48);border:1px solid #ffffffbc;box-shadow:inset 0 1px 0 #ffffffa8;border-radius:16px;backdrop-filter:blur(18px)}
.btn{border-radius:12px;background:rgba(255,255,255,.36);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 #ffffff9c,0 3px 10px #4e263108;transition:transform .18s,box-shadow .18s,background .18s}.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #ffffffb0,0 7px 18px #4e263114;filter:none}.btn.primary{background:linear-gradient(155deg,color-mix(in srgb,var(--green) 82%,white),var(--green));border-color:color-mix(in srgb,var(--green) 55%,transparent);color:var(--on-primary);box-shadow:inset 0 1px 0 #ffffff60,inset 0 -1px 0 #00000012,0 6px 17px #53293420}
.navitem{border:1px solid transparent;border-radius:13px}.navitem.active{background:linear-gradient(140deg,#8f475aaa,var(--green));border-color:#ffffff70;box-shadow:inset 0 1px 0 #ffffff50,0 5px 18px #4a242e13}
.tabs{background:var(--glass-surface);border-color:var(--glass-border);border-radius:17px;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 #ffffffa0;padding:6px}.tabs button{border-radius:12px;transition:background .2s,box-shadow .2s}.tabs button.active{background:rgba(255,255,255,.64);box-shadow:0 2px 7px #4e26310c,inset 0 1px 0 white;border:1px solid #ffffffc0}
